# Course environment: Computational Tools for Data Science (MIAA, IPCA), Practical 2
# Create it:   conda env create -f environment.yml
# Use it:      conda activate ctds
name: ctds
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pandas=3.0
  - numpy=2.4
  - matplotlib=3.11
  - jupyterlab=4.5
  - ipykernel=6.31
  - nbconvert=7.17
